repositories {
    mavenCentral()
    google()
    maven { url = "https://mymaven.bylazar.com/releases" }
    maven { url 'https://repo.dairy.foundation/releases/' } //  To provide another repository where Gradle can look for required packages. Dependencies hosted there can be resolved. Adding the repository alone does not change robot behavior.
}
//What this does: requests SDK 12 components when building the application.
//Why it matters: your app now needs to work with those interfaces. The robot receives the new
// application only after a successful build and installation.
dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    //noinspection Aligned16KB
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'

    implementation 'com.pedropathing:core:3.0.0'
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation 'com.pedropathing:tuning:1.0.0' // IMPORTANT To replace the old Pedro package with the package selected for the new setup.
    implementation 'com.pedropathing:telemetry:1.0.0'
    implementation 'com.pedropathing.ivy:pedro:1.1.1' // IMPORTANT To migrate to the selected Pedro integration package for Ivy.
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.yaml:snakeyaml:2.6'
    implementation 'org.locationtech.jts:jts-core:1.20.0'
}
